# ── Gradle JVM Settings ───────────────────────────────────────────────────────
# 🔴 CI BUILD-FAILURE FIX (round 2): bumping the ksp patch version (2.1.21-2.0.1 →
# 2.1.21-2.0.2) alone did NOT fix the "KSP failed with exit code: PROCESSING_ERROR"
# / cascading "'SystemsGoDatabase' could not be resolved" failure — it reproduces
# identically in BOTH :app:kspDebugKotlin (Lint job) and :app:kspBenchmarkReleaseKotlin
# (CodeQL Analyze job), which rules out a variant-specific cause. KSP2 (the engine
# ksp>=2.0 defaults to) is documented by Google as needing "significantly more memory
# than KSP 1" (https://github.com/google/ksp/blob/main/docs/ksp2.md), and this app's
# annotation-processing load is unusually heavy for a single Gradle worker: one Room
# @Database spanning 64 migrations plus one @Entity with 202 columns, processed
# together with a Hilt module wiring 63 of those migrations by name — all while the
# CI runner is also running native CMake/FreeRDP builds in parallel. The previous
# 3072m heap left too little headroom for KSP2's worker, and a worker OOM/crash is a
# known way to get this exact bare, diagnostic-free PROCESSING_ERROR. Raised to 6144m
# (GitHub-hosted runners have ~7GB available) to give KSP2 room to actually finish.
org.gradle.jvmargs=-Xmx6144m -Xms512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# ── Performance ───────────────────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvm.options=-Xmx4096m

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# REMOVED android.defaults.buildfeatures.buildconfig — deprecated in AGP 8.x
# BuildConfig is now enabled per-module in build.gradle.kts via:
#   buildFeatures { buildConfig = true }

# Suppress only the warnings that are safe to suppress
android.suppressUnsupportedOptionWarnings=android.nonTransitiveRClass
