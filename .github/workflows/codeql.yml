name: CodeQL

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly scan, catches new CodeQL query packs / advisories even with no
    # code changes. Sunday 03:17 UTC (odd minute to avoid the top-of-hour
    # GitHub Actions scheduling crowd).
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # CodeQL needs write access to upload results to the repo's code
    # scanning tab — everything else in this job only reads.
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # This repo has a Kotlin/Java Android app plus a native C
        # (JNI/CMake) layer — scan both. CodeQL's Java analyzer covers
        # Kotlin sources in the same project.
        include:
          - language: java-kotlin
            build-mode: autobuild
          # c-cpp uses build-mode "none": CodeQL infers the C compilation
          # units (app/src/main/cpp/*.c) straight from source, without
          # needing a working build. We stopped using autobuild here
          # because its qmake-wrapper heuristic matches ANY top-level
          # "*.pro" file as a Qt project — including app/proguard-rules.pro,
          # which is not a qmake file at all — and fails with
          # "Extra characters after test expression" before ever reaching
          # the real Gradle/NDK build.
          - language: c-cpp
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
